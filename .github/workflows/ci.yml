name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff / pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rihrp_app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: rihrp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rihrp_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIHRP_ENV: test
      RIHRP_DATABASE_URL: postgresql+psycopg://rihrp_app:ci-password@127.0.0.1:5432/rihrp_test
      RIHRP_TEST_DATABASE_URL: postgresql+psycopg://rihrp_app:ci-password@127.0.0.1:5432/rihrp_test
      PGPASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Create test database
        run: psql -h 127.0.0.1 -U rihrp_app -d rihrp -c "CREATE DATABASE rihrp_test"
      - name: Lint
        run: |
          ruff check apps/api tests
          ruff format --check apps/api tests
      - name: OpenAPI drift
        run: python infra/db/export_openapi.py --check
      - name: Test
        run: pytest -q

  web:
    name: Web (tsc / vitest / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx vitest run
      - run: npm run build

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
