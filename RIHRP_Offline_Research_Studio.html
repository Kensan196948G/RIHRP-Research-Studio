<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIHRP Research Studio — 研究着想・仮説洗練プラットフォーム</title>
<style>
:root{
 --bg:#f3f5f7;--panel:#ffffff;--panel2:#f7f9fb;--ink:#0f172a;--ink2:#475569;--ink3:#8a96a8;--line:#e3e8ee;
 --accent:#0f766e;--accentInk:#0b5f59;--accentSoft:#e0f4f1;--onAccent:#ffffff;--top:#0d1f22;
 --good:#15803d;--goodSoft:#e3f5e8;--warn:#b45309;--warnSoft:#fdf3dc;--bad:#b91c1c;--badSoft:#fce8e8;--info:#1d4ed8;--infoSoft:#e4ecfd;
 --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05);--r:12px;--mono:Consolas,"SFMono-Regular",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0d1416;--panel:#141d20;--panel2:#182427;--ink:#e6edf0;--ink2:#a9b6bd;--ink3:#73828a;--line:#26353b;
 --accent:#2dd4bf;--accentInk:#5eead4;--accentSoft:#123430;--onAccent:#062a26;--top:#081113;
 --good:#4ade80;--goodSoft:#14301f;--warn:#fbbf24;--warnSoft:#33280f;--bad:#f87171;--badSoft:#3a1717;--info:#93c5fd;--infoSoft:#16243d;
 --shadow:0 1px 2px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Yu Gothic UI","Yu Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.35}
/* top bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:9px 18px;background:var(--top);color:#eef6f5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:grid;place-items:center;font:800 13px var(--mono);color:#042f2b;flex:none}
.brand-t{font-weight:700;font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand-s{font-size:11px;opacity:.7;white-space:nowrap;line-height:1.45}
.brand-s b{color:#5eead4;font-weight:800}
.offbadge{font-size:11px;padding:2px 9px;border:1px solid rgba(255,255,255,.35);border-radius:99px;white-space:nowrap}
.offbadge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#facc15;margin-right:6px;vertical-align:1px}
.topr{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topbar select{background:#17302f;border:1px solid #2b4a48;color:#eef6f5;border-radius:8px;padding:5px 8px;max-width:280px}
.tbtn{background:transparent;border:1px solid #2b4a48;color:#eef6f5;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.tbtn:hover{background:#17302f}
.saveState{font-size:11.5px;opacity:.7;white-space:nowrap}
.gprog{display:flex;align-items:center;gap:8px;font-size:11.5px;white-space:nowrap}
.gprog .bar{width:110px;height:6px;background:#22403e;border-radius:9px;overflow:hidden}
.gprog .bar i{display:block;height:100%;background:#2dd4bf;transition:width .25s}
.notice{background:var(--warnSoft);color:var(--ink2);font-size:12.5px;padding:6px 18px;border-bottom:1px solid var(--line)}
.notice b{color:var(--warn)}
/* layout */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 90px)}
nav#nav{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px;position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);overflow:auto}
.navcap{font-size:11px;color:var(--ink3);letter-spacing:.08em;margin:2px 10px 8px}
.navitem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;margin-bottom:2px}
.navitem:hover{background:var(--panel2)}
.navitem .num{font:700 12px var(--mono);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);flex:none;color:var(--ink2)}
.navitem.active{background:var(--accentSoft)}
.navitem.active .num{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.navitem .lbl{display:block;font-weight:650;font-size:13.5px}
.navitem .st{display:block;font-size:11.5px;color:var(--ink3)}
.navitem .st.on{color:var(--accentInk)}
.navfoot{margin:16px 8px 0;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3)}
main{padding:22px 26px 70px;min-width:0}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 nav#nav{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;gap:4px;border-right:0;border-bottom:1px solid var(--line);top:auto}
 .navcap,.navfoot{display:none}
 .navitem{min-width:150px;margin:0}
 main{padding:16px}
 .topbar{padding:8px 12px;position:static}
 .brand-s{white-space:normal;font-size:10.5px}
}
/* page */
.page-head{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font:700 11.5px var(--mono);color:var(--accentInk);letter-spacing:.1em}
.page-head h1{font-size:22px;margin-top:2px}
.sub{color:var(--ink2);margin:4px 0 0;font-size:13px;max-width:720px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;min-width:0}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .cnt{font:600 12px var(--mono);color:var(--ink3)}
.card h3{font-size:13.5px;margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.good{color:var(--good)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:12.5px;font-weight:650;color:var(--ink2);margin:12px 0 5px}
label.f small{font-weight:400;color:var(--ink3);margin-left:6px}
input[type=text],textarea,select.in,input[type=number]{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;outline:none}
textarea{resize:vertical;min-height:80px;line-height:1.6}
input[type=text]:focus,textarea:focus,select.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px;cursor:pointer}
.hint{font-size:12px;color:var(--ink3);margin:6px 0 0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--goodSoft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--infoSoft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accentSoft);color:var(--accentInk);border-color:transparent}
.chip.mock{border-style:dashed}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin:0 4px 4px 0;color:var(--ink2)}
.muted{color:var(--ink3)}
.empty{text-align:center;padding:34px 16px;color:var(--ink2)}
.empty .big{font-size:30px;opacity:.5}
.empty p{margin:8px 0 14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warnSoft);border:1px solid rgba(180,83,9,.25)}
.banner.info{background:var(--infoSoft);border:1px solid rgba(29,78,216,.2)}
.banner.acc{background:var(--accentSoft);border:1px solid rgba(15,118,110,.25)}
/* live check */
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv span{color:var(--ink3)}
.flowline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.pill{padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px}
.pill.iv{background:var(--infoSoft);color:var(--info)}
.pill.dv{background:var(--accentSoft);color:var(--accentInk)}
.arrow{color:var(--ink3);font-weight:700}
.dirtag{font-size:12px;color:var(--ink2);border:1px solid var(--line);padding:2px 8px;border-radius:6px}
ul.checks{list-style:none;padding:0;margin:10px 0 0}
ul.checks li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
ul.checks li:last-child{border-bottom:0}
ul.checks .ck{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;margin-top:1px}
ul.checks li.ok .ck{background:var(--goodSoft);color:var(--good)}
ul.checks li.ng .ck{background:var(--warnSoft);color:var(--warn)}
ul.checks b{display:block;font-weight:650}
ul.checks small{color:var(--ink3);font-size:12px}
.qscore{margin-top:10px;font-size:13px;color:var(--ink2)}
.qscore b{font:800 20px var(--mono);color:var(--accentInk)}
.samples{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sample{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);cursor:pointer;text-align:left}
.sample:hover{border-color:var(--accent)}
.sample b{display:block;font-size:12.5px;margin-top:3px}
.revs{list-style:none;padding:0;margin:0;font-size:12.5px}
.revs li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.revs li:last-child{border:0}
.revs .rv{font:700 11.5px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none}
.revs .txt{flex:1;min-width:0;color:var(--ink2)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat span{display:block;font-size:11.5px;color:var(--ink3)}
.stat b{font:800 22px var(--mono)}
/* tasks */
.dagwrap{overflow-x:auto;padding-bottom:4px}
.dag text{font-family:"Yu Gothic UI","Meiryo",sans-serif}
.dag .edge{fill:none;stroke:var(--line);stroke-width:2}
.dag .edge.on{stroke:var(--accent);stroke-width:2}
.dag .node rect.box{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.dag .node.ready rect.box{stroke:var(--info);fill:var(--infoSoft)}
.dag .node.running rect.box{stroke:var(--accent);fill:var(--accentSoft);stroke-width:2.5}
.dag .node.approval rect.box{stroke:var(--warn);fill:var(--warnSoft);stroke-width:2.5;stroke-dasharray:5 3}
.dag .node.done rect.box{stroke:var(--good);fill:var(--goodSoft)}
.dag .t1{font-size:12px;font-weight:700;fill:var(--ink)}
.dag .t2{font-size:10.5px;fill:var(--ink2)}
.dag .t3{font-size:10px;font-weight:700}
.dag .pb{fill:var(--line)}
.dag .pf{fill:var(--accent)}
.dag .node.done .pf{fill:var(--good)}
.dag .node.approval .pf{fill:var(--warn)}
.dag .node.running rect.box{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tblwrap{overflow-x:auto}
table.tbl th{text-align:left;font-size:11.5px;color:var(--ink3);font-weight:650;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.agentcell{display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none}
.pbar{height:7px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;min-width:90px}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pbar.done i{background:var(--good)}
.pbar.approval i{background:var(--warn)}
.st-badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st-blocked{background:var(--panel2);color:var(--ink3)}
.st-ready{background:var(--infoSoft);color:var(--info)}
.st-running{background:var(--accentSoft);color:var(--accentInk)}
.st-paused{background:var(--panel2);color:var(--ink2);border:1px dashed var(--ink3)}
.st-approval{background:var(--warnSoft);color:var(--warn)}
.st-done{background:var(--goodSoft);color:var(--good)}
.logbox{font:12px/1.7 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.logbox .lt{color:var(--ink3)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 8px}
/* debate */
.debate{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px}
@media (max-width:1000px){.debate{grid-template-columns:1fr}}
.agents{display:flex;flex-direction:column;gap:6px}
.agent{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.agent .av{width:30px;height:30px;font-size:12px}
.agent .nm{font-size:12.5px;font-weight:700;display:block;line-height:1.3}
.agent .rl{font-size:11px;color:var(--ink3);display:block;line-height:1.3}
.agent .chip{margin-left:auto;font-size:10.5px}
.agent.speaking{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.meter{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));position:relative;margin:8px 0 4px;opacity:.85}
.meter i{position:absolute;top:-4px;width:4px;height:18px;background:var(--ink);border-radius:2px;transition:left .4s}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}
.chat{display:flex;flex-direction:column;gap:12px;height:56vh;min-height:340px;overflow:auto;padding:4px 6px 4px 2px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg.new{animation:pop .32s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;max-width:780px;min-width:0}
.who{font-size:12px;font-weight:750;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.bubble p{margin:0;font-size:13.5px;overflow-wrap:anywhere}
.msg.you{flex-direction:row-reverse}
.msg.you .bubble{background:var(--accentSoft);border-color:transparent;border-radius:14px 4px 14px 14px}
.msg.you .who{justify-content:flex-end}
.roundsep{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink3);font-weight:700;letter-spacing:.04em;margin:6px 0}
.roundsep::before,.roundsep::after{content:"";flex:1;height:1px;background:var(--line)}
.typing{display:flex;gap:10px;align-items:center;color:var(--ink3);font-size:12.5px}
.typing .dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-right:3px;animation:bl 1s infinite}
.typing .dots span:nth-child(2){animation-delay:.15s}.typing .dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.2}}
.composer{border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qchip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 11px;font-size:12px;cursor:pointer}
.qchip:hover{border-color:var(--accent);color:var(--accentInk)}
.composer .cr{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:58px}
/* evidence */
.evlist{display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--panel2)}
.ev.off{opacity:.5}
.ev .t{font-weight:700;font-size:13.5px}
.ev .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}
.ev .sum{font-size:12.5px;color:var(--ink2);margin:4px 0 6px}
.ev .bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--ink3);max-width:420px}
.ev .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ev select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 6px;font-size:12px}
.minibar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--accent)}
.crit{border-left:4px solid var(--line);padding:9px 12px;border-radius:0 9px 9px 0;background:var(--panel2);margin-bottom:8px}
.crit.s高{border-left-color:var(--bad)}.crit.s中{border-left-color:var(--warn)}.crit.s低{border-left-color:var(--info)}
.crit.closed{opacity:.55}
.crit .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.crit p{margin:4px 0;font-size:13px}
.crit .sug{font-size:12.5px;color:var(--ink2)}
.crit .sug::before{content:"改善案：";font-weight:700;color:var(--accentInk)}
ol.fals{margin:4px 0 0;padding-left:20px;font-size:13px}
ol.fals li{margin-bottom:4px}
.mth{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.mth:last-child{border:0}
.lvl{display:inline-flex;gap:2px}
.lvl i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.lvl.c i.on{background:var(--warn)}
.ethi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ethi:last-child{border:0}
.ethi .a{font-size:12px;color:var(--ink2)}
.addform{border:1px dashed var(--accent);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--panel2)}
/* compare */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.cand{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--panel);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.cand.main{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft)}
.cand.rej{opacity:.55}
.cand .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cand .lb{font:800 15px var(--mono);color:var(--accentInk)}
.cand .tx{font-size:13px;margin:0}
.cand .tot{margin-left:auto;font:800 20px var(--mono)}
.cand .tot small{font-size:11px;color:var(--ink3);font-weight:600}
.sc{display:grid;grid-template-columns:96px 1fr 30px;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--ink2)}
.sc b{font:700 11.5px var(--mono);text-align:right;color:var(--ink)}
.cand .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:4px;align-items:center}

const NUMRE=/[0-9０-９]+(?:[.．][0-9０-９]+)?\s*(?:%|％|倍|℃|度|mm|cm|m|t|kN|MPa|N\/mm|日|時間|週|か月|ヶ月|年|割|回|‰)/g;
const VAGUE=['向上','改善','効率化','最適化','有効','大幅','効果的','適切','良好','高める','短縮'];
const DIRS=[['低減','低減'],['減少','減少'],['抑制','抑制'],['低下','低下'],['短縮','短縮'],['小さく','減少'],['収まる','許容範囲内'],['増加','増加'],['向上','向上'],['上昇','上昇'],['改善','改善'],['大きく','増加']];
function allVars(){const r=[];FIELD_KEYS.forEach(k=>FIELDS[k].vars.forEach(v=>r.push(Object.assign({field:k},v))));return r}
function varInfo(n){return allVars().find(v=>v.n===n)||null}
const unitOf=n=>{const v=varInfo(n);return v&&v.u!=='—'?v.u:'定量指標'};
const measureOf=n=>{const v=varInfo(n);return v?v.m:'記録・計測'};
function findVars(text,field){
 const pool=field==='general'?allVars():FIELDS[field].vars;
 const res=[];
 pool.forEach(v=>{let idx=-1;[v.n].concat(v.a||[]).forEach(nm=>{const i=text.indexOf(nm);if(i>=0&&(idx<0||i<idx))idx=i});if(idx>=0&&!res.some(r=>r.n===v.n))res.push({n:v.n,idx,o:!!v.o})});
 return res.sort((x,y)=>x.idx-y.idx);
}
function detectField(text){
 let best='general',bs=0;
 ['river','geo','concrete','construction'].forEach(k=>{const F=FIELDS[k];let s=0;F.kw.forEach(w=>{if(text.includes(w))s+=2});s+=findVars(text,k).length;if(s>bs){bs=s;best=k}});
 return best;
}
function analyze(p){
 const text=p.hypothesis||'';const full=text+' '+(p.conditions||'');
 const field=(p.field&&p.field!=='auto'&&FIELDS[p.field])?p.field:detectField(full);
 const F=FIELDS[field];
 const found=findVars(text,field);
 const dvObj=found.find(f=>f.o);
 let dv=dvObj?dvObj.n:null;
 let iv=null;
 if(dvObj){const before=found.filter(f=>f.n!==dv&&f.idx<dvObj.idx);iv=before.length?before[before.length-1].n:null}
 if(!iv){const f=found.find(x=>x.n!==dv);iv=f?f.n:null}
 const inferred=[];
 if(!dv){dv=F.defDV===iv?F.vars.find(v=>v.o&&v.n!==iv).n:F.defDV;inferred.push(dv)}
 if(!iv){iv=F.defIV===dv?F.vars.find(v=>!v.o&&v.n!==dv).n:F.defIV;inferred.push(iv)}
 const vars=uniq([iv,dv].concat(found.map(f=>f.n)));
 const nums=(text.match(NUMRE)||[]).map(s=>s.replace(/\s/g,''));
 const d=DIRS.find(x=>text.includes(x[0]));
 const a={field,iv,dv,vars,inferred,dir:d?d[1]:'',nums:uniq(nums),hasNum:nums.length>0,
  hasMech:/ため|により|によって|ことで|ので|メカニズム|機構|原因|に起因/.test(text),
  hasCond:/において|における|の場合|場合|条件|では|範囲|時に|時の|に限|対象/.test(text)||(p.conditions||'').trim().length>8,
  hasComp:/比べ|比較|対照|従来|に対し|と比|未対策|現行/.test(text),
  vague:VAGUE.filter(w=>text.includes(w))};
 a.quality=[a.hasNum,a.hasMech,a.hasCond,a.hasComp,!a.vague.length||a.hasNum].filter(Boolean).length;

}

function altVars(p){

 let pool=F.vars.map(v=>v.n).filter(n=>n!==a.iv&&n!==a.dv);
 pool=shuffle(pool,r).sort((x,y)=>(evTags.has(y)?1:0)-(evTags.has(x)?1:0));
 while(pool.length<3)pool.push(pool[0]||'外部要因');
 return pool;
}

// evidence
function relevance(e,a){
 const tags=e.tags||[];
 if(!tags.length)return e.source==='builtin'?0:20;
 const ov=tags.filter(t=>a.vars.includes(t)).length;
 const base=ov/Math.max(1,Math.min(3,a.vars.length));
 return clamp(Math.round(base*78+(tags.includes(a.iv)?12:0)+(tags.includes(a.dv)?10:0)),0,100);
}
function reliabilityOf(e){
 let s=TYPE_W[e.type]||50;const y=+e.year||0;
 if(y>=2020)s+=5;else if(y&&y<2012)s-=10;
 const n=e.n;
 if(n!=null&&n!==''){if(n>=100)s+=5;else if(n<5)s-=14;else if(n<20)s-=5}
 if(e.note&&/再分類/.test(e.note))s-=0;
 return clamp(Math.round(s),10,98);
}

function gatherEvidence(p){
 const a=A(p);
 const imported=(p.evidence||[]).filter(e=>e.source!=='builtin');
 const keys=a.field==='general'?['river','geo','concrete','construction']:[a.field];
 let built=[];
 keys.forEach(k=>CORPUS[k].forEach((x,i)=>built.push({id:'ev_'+k+'_'+i,title:x[0],type:x[1],year:x[2],n:x[3],stance:x[4],tags:x[5],summary:x[6],source:'builtin',accepted:true})));
 const prev={};(p.evidence||[]).forEach(e=>{prev[e.id]=e});
 built.forEach(e=>{const o=prev[e.id];if(o){e.accepted=o.accepted;if(o.userStance){e.stance=o.stance;e.userStance=true;e.note=o.note}}});
 let all=built.concat(imported);
 all.forEach(e=>{e.relevance=relevance(e,a)});
 all=all.filter(e=>e.relevance>0||e.source!=='builtin').sort((x,y)=>y.relevance-x.relevance);
 if(a.field==='general'){const imp=all.filter(e=>e.source!=='builtin');all=all.filter(e=>e.source==='builtin').slice(0,8).concat(imp)}

}
function verifyEvidence(p){(p.evidence||[]).forEach(e=>{e.reliability=reliabilityOf(e)});p.verified=true}

// plan
function makePlan(p){

 const ms=F.methods.map(x=>Object.assign({},x,{fit:x.val*2-x.cost*(m.budget?2.5:0.7)-x.time*(m.time?1.8:0.5)})).sort((x,y)=>y.fit-x.fit);

 return{methods:ms.slice(0,3),
  measures:uniq([a.iv,a.dv].concat(a.vars)).slice(0,5).map(n=>({n,u:unitOf(n),m:measureOf(n),role:n===a.iv?'独立変数':n===a.dv?'従属変数':'関連変数'})),

  const c={id:uid('c'),label:'',type:'研究者提案',text:`${v}を${a.iv}とあわせて評価すると、${a.dv}の説明力が高まる。`,vars:[v,a.iv,a.dv],origin:'研究者×仮説創出AI',status:'候補'};
  if(!P.candidates)P.candidates=[makeH0(P)];
  P.candidates.push(c);P.candidates.forEach((x,i)=>{x.label='H'+i});
  R.push(['ide','提案',`ご指摘の「${v}」を軸にした派生仮説を${c.label}として候補に追加しました（05 新仮説比較）。`]);

function stances(p){
 const ev=activeEv(p);const sup=ev.filter(e=>e.stance==='support').length,con=ev.filter(e=>e.stance==='contradict').length;
 const avg=avgRel(ev);const open=(p.critiques||[]).filter(c=>c.status==='未対応');const hi=open.filter(c=>c.sev==='高').length;
 const h0=(p.candidates||[]).find(c=>c.origin==='主仮説');const S=(l,t)=>({l,t});
 return{
  fac:S('中立','info'),
  lit:!ev.length?S('未調査',''):sup>con?S('支持寄り','good'):sup===con?S('拮抗','warn'):S('懸念','bad'),
  evi:avg==null?S('未検証',''):avg>=72?S('概ね妥当','good'):avg>=60?S('条件付き','warn'):S('懸念','bad'),
  met:!p.plan?S('未検討',''):(p.analysis&&p.analysis.hasNum?S('検証可能','good'):S('基準要設定','warn')),
  cri:!p.critiques?S('未レビュー',''):hi?S('強い懸念','bad'):open.length?S('懸念あり','warn'):S('概ね解消','good'),
  ide:!p.candidates?S('未提案',''):S('代替案あり','warn'),
  eth:!p.ethics?S('未確認',''):p.ethics.some(i=>i.level==='要確認')?S('要確認あり','warn'):S('問題なし','good'),
  int:!h0||h0.total==null?S('未評価',''):h0.total>=65?S('有望','good'):h0.total>=50?S('改善余地','warn'):S('再検討','bad')
 };
}
function consensus(p){
 const ev=activeEv(p);const hs=ev.filter(e=>e.stance==='support'&&(e.reliability||0)>=75).length;
 const crs=p.critiques||[];const open=crs.filter(c=>c.status==='未対応');
 let v=50+hs*6-open.filter(c=>c.sev==='高').length*9-open.filter(c=>c.sev==='中').length*3+crs.filter(c=>c.status!=='未対応').length*3;
 if((p.candidates||[]).some(c=>c.status==='採択'))v+=8;
 return clamp(Math.round(v),3,97);
}

// ---------- orchestrator ----------
const tdef=k=>TASK_DEFS.find(d=>d.key===k);
const task=(p,k)=>p.tasks.find(t=>t.key===k);
function refreshReady(p){p.tasks.forEach(t=>{if(t.status==='blocked'&&tdef(t.key).deps.every(k=>task(p,k).status==='done'))t.status='ready'})}
function descendants(k){const out=new Set([k]);let grow=true;while(grow){grow=false;TASK_DEFS.forEach(d=>{if(!out.has(d.key)&&d.deps.some(x=>out.has(x))){out.add(d.key);grow=true}})}return out}
const EFFECTS={
 struct:p=>{p.analysis=analyze(p)},
 lit:p=>{gatherEvidence(p)},
 method:p=>{p.plan=makePlan(p)},
 verify:p=>{verifyEvidence(p)},
 ethics:p=>{p.ethics=ethicsCheck(p)},
 critic:p=>{refreshCritiques(p);if(!p.critiques)p.critiques=makeCritiques(p);p.falsification=makeFalsification(p)},
 debate:p=>{p.debate=generateDebate(p);p.debateShown=0},
 ideate:p=>{genCandidates(p)},
 evaluate:p=>{scoreAll(p)},
 report:p=>{p.reportAt=nowStr()}
};
function overall(p){return Math.round(p.tasks.reduce((s,t)=>s+(t.status==='done'||t.status==='approval'?100:t.progress),0)/p.tasks.length)}
function startOrch(){
 if(!P.hypothesis.trim()){toast('研究仮説を入力してください');go('register');return}
 refreshReady(P);
 if(P.tasks.every(t=>t.status==='done')){toast('全タスクが完了しています。「全体を再実行」で再実行できます');return}
 if(!P.tasks.some(t=>['ready','running'].includes(t.status))){toast('研究者の承認待ちのタスクがあります');return}
 RT.running=true;RT.resumeOnApprove=false;log('▶ オーケストレーター開始');
 clearInterval(RT.timer);RT.timer=setInterval(tick,260);render();
}
function stopOrch(msg){if(RT.running&&msg)log(msg);RT.running=false;clearInterval(RT.timer);RT.timer=null}
function tick(){if(RT.running&&P)advance(1)}
function advance(mult){
 const p=P;refreshReady(p);let changed=false;
 const running=p.tasks.filter(t=>t.status==='running');
 for(const t of p.tasks){if(running.length>=3)break;if(t.status==='ready'){t.status='running';t.progress=0;t.startedAt=nowStr();running.push(t);changed=true;const d=tdef(t.key);log(`[開始] ${d.name}（${AGENTS[d.agent].name}）`)}}
 running.forEach(t=>{const d=tdef(t.key);t.progress=Math.min(100,t.progress+(100/d.dur)*(0.75+Math.random()*0.5)*mult*(DB.settings.speed||1));if(t.progress>=100){completeTask(t);changed=true}});
 const pending=p.tasks.some(t=>['ready','running'].includes(t.status));
 if(!pending&&RT.running){
  if(p.tasks.some(t=>t.status==='approval')){stopOrch('⏸ 研究者の承認待ちのため停止しました');RT.resumeOnApprove=true;toast('研究者の承認が必要なタスクがあります')}
  else if(p.tasks.every(t=>t.status==='done')){stopOrch('■ 全タスクが完了しました');toast('研究フローが完了しました。06で報告書を確認できます')}
 }
 touch();
 if(changed)render();else updateLive();
}
function completeTask(t){
 const d=tdef(t.key);t.progress=100;t.runs=(t.runs||0)+1;t.endedAt=nowStr();
 try{EFFECTS[t.key](P)}catch(e){console.error(e);log('[エラー] '+d.name+'：'+e.message)}
 if(d.approval){t.status='approval';log(`[承認待ち] ${d.name} — 研究者の確認が必要です`)}
 else{t.status='done';log(`[完了] ${d.name}`)}
 if(t.key==='debate'&&RT.view==='debate')setTimeout(playDebate,200);
 refreshReady(P);
}
function stepOnce(){
 if(!P.hypothesis.trim()){toast('研究仮説を入力してください');return}
 if(RT.running)stopOrch('⏸ ステップ実行のため一時停止');
 refreshReady(P);
 if(!P.tasks.some(t=>['ready','running'].includes(t.status))){toast(P.tasks.every(t=>t.status==='done')?'全タスク完了済みです':'承認待ちのタスクがあります');return}

function approve(k){

function resetAll(silent){
 stopOrch();
 P.tasks=TASK_DEFS.map(d=>({key:d.key,status:'blocked',progress:0,runs:0}));
 P.analysis=null;P.plan=null;P.ethics=null;P.critiques=null;P.falsification=null;P.debate=[];P.debateShown=0;P.reportAt=null;P.verified=false;
 P.evidence=(P.evidence||[]).filter(e=>e.source!=='builtin');P.evidence.forEach(e=>{delete e.reliability});
 if(P.candidates){const keep=P.candidates.filter(c=>c.origin!=='主仮説'&&['採択','保留'].includes(c.status));P.candidates=keep.length?keep:null}

function runUpTo(k){
 if(!P.hypothesis.trim()){toast('研究仮説を入力してください');go('register');return}
 stopOrch();
 const need=new Set();(function add(x){need.add(x);tdef(x).deps.forEach(add)})(k);
 TASK_DEFS.forEach(d=>{if(!need.has(d.key))return;const t=task(P,d.key);if(t.status==='done')return;
  if(t.status!=='approval'){try{EFFECTS[d.key](P)}catch(e){console.error(e);log('[エラー] '+e.message)}t.runs=(t.runs||0)+1}
  t.status='done';t.progress=100;t.endedAt=nowStr();log(`[即時実行] ${d.name}${d.approval?'（デモのため自動承認）':''}`)});

function startFlow(){
 if(!P.hypothesis.trim()){toast('研究仮説を入力してください');return}

function recordRevision(note){
 const last=P.revisions[P.revisions.length-1];
 if(last&&last.hypothesis===P.hypothesis&&last.conditions===P.conditions)return false;
 P.revision=(last?last.rev:0)+1;

function stanceFromText(t){if(/効果なし|効果は限定|有意差なし|有意な差は(見|認)められ|反する|悪化|超える|増大|見られなかった/.test(t))return'contradict';if(/確認した|有効|低減した|向上した|改善した|減少した|収まった|示した/.test(t))return'support';return'neutral'}
function tagsFromText(t){const a=A(P);const f=findVars(t,a.field).map(x=>x.n);return f.length?f:findVars(t,'general').map(x=>x.n).slice(0,4)}
function addImported(o){
 const e={id:uid('imp'),title:o.title||'無題の資料',type:EV_TYPES.includes(o.type)?o.type:'取込資料',year:+o.year||new Date().getFullYear(),n:o.n===''||o.n==null?null:+o.n,
  stance:['support','contradict','neutral'].includes(o.stance)?o.stance:stanceFromText((o.summary||'')+(o.title||'')),
  tags:Array.isArray(o.tags)&&o.tags.length?o.tags:tagsFromText((o.title||'')+' '+(o.summary||'')),summary:short(o.summary||'',220),source:o.source||'import',accepted:true};
 e.relevance=relevance(e,A(P));if(P.verified||task(P,'verify').status==='done')e.reliability=reliabilityOf(e);
 P.evidence.push(e);return e;
}
function parseCSV(text){
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
  else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}
 if(cell||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()));
}
function importEvidenceFiles(files){
 let count=0;const jobs=[...files].map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const txt=String(r.result||'');
  try{
   if(/\.json$/i.test(f.name)){const d=JSON.parse(txt);const arr=Array.isArray(d)?d:(Array.isArray(d.evidence)?d.evidence:[d]);arr.forEach(o=>{if(o&&typeof o==='object'){addImported(o);count++}})}
   else if(/\.csv$/i.test(f.name)){const rows=parseCSV(txt);const head=rows[0].map(h=>h.trim().toLowerCase());const hasHead=head.includes('title')||head.includes('タイトル');
    const idx=k=>head.findIndex(h=>k.includes(h));
    (hasHead?rows.slice(1):rows).forEach(r=>{const g=(keys,def)=>{if(!hasHead)return def;const i=idx(keys);return i>=0?r[i]:''};
     const st=(g(['stance','立場'],'')||'').trim();const stMap={'支持':'support','反証':'contradict','中立':'neutral'};
     addImported({title:hasHead?g(['title','タイトル']):r[0],type:g(['type','種別']),year:g(['year','年']),n:g(['n','標本数']),stance:stMap[st]||st,summary:hasHead?g(['summary','概要']):r.slice(1).join(' ')});count++})}
   else{const lines=txt.split(/\r?\n/).filter(x=>x.trim());addImported({title:f.name.replace(/\.[^.]+$/,''),summary:lines.join(' '),type:'取込資料'});count++}
  }catch(e){toast(f.name+' を読み込めませんでした：'+e.message)}
  res()};r.onerror=()=>{toast(f.name+' の読込に失敗しました');res()};r.readAsText(f)}));
 Promise.all(jobs).then(()=>{if(count){log(`[取込] ローカル資料 ${count}件を追加`);decide(`ローカル資料${count}件を根拠として取込`);refreshCritiques(P);scoreAll(P);touch();render();toast(count+'件の資料を取り込みました')}});
}
function importAll(file){
 const r=new FileReader();r.onload=()=>{try{

  if(d&&Array.isArray(d.projects))list=d.projects;else if(d&&d.hypothesis!==undefined)list=[d];else throw new Error('RIHRPのデータ形式ではありません');
  if(!confirm(`${list.length}件の研究データを読み込み、現在の一覧に追加します。よろしいですか？`))return;
  list.forEach(p=>{if(DB.projects.some(x=>x.id===p.id))p.id=uid('prj');normalize(p);DB.projects.push(p)});

function sanitizeP(p){
 const n=(v,d)=>{const x=typeof v==='number'?v:Number(v);return Number.isFinite(x)?x:d};
 const pick=(v,set,d)=>set.includes(v)?v:d;
 const s=(v,d)=>typeof v==='string'?v:d;
 const list=v=>Array.isArray(v)?v:[];
 const obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:null;
 const cl=(v,lo,hi,d)=>Math.min(hi,Math.max(lo,n(v,d)));
 p.id=s(p.id,'');
 p.title=s(p.title,'無題');p.hypothesis=s(p.hypothesis,'');p.background=s(p.background,'');p.conditions=s(p.conditions,'');p.reportNote=s(p.reportNote,'');

 p.tasks=list(p.tasks).filter(x=>x&&typeof x==='object');
 p.tasks.forEach(t=>{t.status=pick(t.status,['blocked','ready','running','approval','done'],'blocked');t.progress=cl(t.progress,0,100,0);t.runs=cl(Math.floor(n(t.runs,0)),0,100000,0)});
 p.evidence=list(p.evidence).filter(x=>x&&typeof x==='object');
 p.evidence.forEach(e=>{e.stance=pick(e.stance,['support','contradict','neutral'],'neutral');e.reliability=e.reliability==null?null:cl(e.reliability,0,100,0);e.relevance=cl(e.relevance,0,100,0);e.tags=list(e.tags)});
 p.critiques=Array.isArray(p.critiques)?p.critiques.filter(x=>x&&typeof x==='object'):null;
 (p.critiques||[]).forEach(c=>{c.sev=pick(c.sev,['高','中','低'],'低');c.status=pick(c.status,['未対応','対応済','却下'],'未対応')});
 p.candidates=Array.isArray(p.candidates)?p.candidates.filter(x=>x&&typeof x==='object'):null;
 (p.candidates||[]).forEach(c=>{c.status=pick(c.status,['候補','採択','保留','却下','主仮説'],'候補');const q=obj(c.scores)||{};c.scores={evidence:cl(q.evidence,0,100,0),testability:cl(q.testability,0,100,0),burden:cl(q.burden,0,100,0),importance:cl(q.importance,0,100,0),novelty:cl(q.novelty,0,100,0)};c.total=cl(c.total,0,100,0)});
 const pl=obj(p.plan);
 if(pl){pl.methods=list(pl.methods).filter(x=>x&&typeof x==='object');pl.measures=list(pl.measures).filter(x=>x&&typeof x==='object');pl.controls=list(pl.controls).filter(x=>x&&typeof x==='object');
  pl.methods.forEach(m=>{m.cost=cl(m.cost,1,5,3);m.time=cl(m.time,1,5,3);m.val=cl(m.val,1,5,3)});
  pl.measures.forEach(m=>{m.role=pick(m.role,['独立変数','従属変数','関連変数','統制変数'],'関連変数')});

function dagSVG(){
 const lv={};TASK_DEFS.forEach(d=>{lv[d.key]=d.deps.length?Math.max(...d.deps.map(k=>lv[k]))+1:0});
 const cols={};TASK_DEFS.forEach(d=>{(cols[lv[d.key]]=cols[lv[d.key]]||[]).push(d.key)});
 const W=150,H=70,GX=34,GY=20;const nC=Object.keys(cols).length;const maxR=Math.max(...Object.values(cols).map(c=>c.length));
 const width=nC*(W+GX)-GX+20,height=maxR*(H+GY)-GY+20;const pos={};
 Object.keys(cols).forEach(c=>{const arr=cols[c];const top=(height-(arr.length*(H+GY)-GY))/2;arr.forEach((k,i)=>{pos[k]={x:10+(+c)*(W+GX),y:top+i*(H+GY)}})});
 let edges='',nodes='';
 TASK_DEFS.forEach(d=>d.deps.forEach(k=>{const a=pos[k],b=pos[d.key];const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2;const on=task(P,k).status==='done';
  edges+=`<path class="edge${on?' on':''}" d="M${x1},${y1} C${x1+GX/2+6},${y1} ${x2-GX/2-6},${y2} ${x2},${y2}"/>`}));
 TASK_DEFS.forEach(d=>{const t=task(P,d.key),p=pos[d.key],ag=AGENTS[d.agent];const st=t.status==='running'&&!RT.running?'一時停止':ST_LABEL[t.status];
  const col={done:'var(--good)',approval:'var(--warn)',running:'var(--accentInk)',ready:'var(--info)',blocked:'var(--ink3)'}[t.status];
  nodes+=`<g class="node ${t.status}"><title>${esc(d.name)}：${esc(d.desc)}</title><rect class="box" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="9"/>
  <circle cx="${p.x+16}" cy="${p.y+17}" r="9" fill="${ag.color}"/><text x="${p.x+16}" y="${p.y+21}" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">${ag.short}</text>
  <text class="t1" x="${p.x+31}" y="${p.y+21}">${esc(d.short)}</text>
  <text class="t3" x="${p.x+10}" y="${p.y+43}" style="fill:${col}">${st}${d.approval?'　◆承認':''}</text>
  <rect class="pb" x="${p.x+10}" y="${p.y+54}" width="${W-20}" height="5" rx="2.5"/><rect class="pf" data-spbar="${d.key}" data-w="${W-20}" x="${p.x+10}" y="${p.y+54}" width="${Math.round((W-20)*t.progress/100)}" height="5" rx="2.5"/></g>`});
 return`<svg class="dag" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="タスク依存関係グラフ">${edges}${nodes}</svg>`;
}

function radarSVG(cands){
 const axes=[['evidence','根拠の充足度'],['testability','検証可能性'],['lowBurden','実験負担の低さ'],['importance','研究上の重要性'],['novelty','新規性（例示）']];
 const cx=180,cy=150,R=105,N=axes.length;const pt=(i,v)=>{const ang=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(ang)*R*v/100,cy+Math.sin(ang)*R*v/100]};
 let g='';[25,50,75,100].forEach(l=>{g+=`<polygon class="grid" points="${axes.map((_,i)=>pt(i,l).join(',')).join(' ')}"/>`});
 axes.forEach((a,i)=>{const[x,y]=pt(i,100);const[lx,ly]=pt(i,122);g+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${x}" y2="${y}"/><text x="${lx}" y="${ly+4}" text-anchor="middle">${a[1]}</text>`});
 cands.forEach(c=>{const col=PALETTE[P.candidates.indexOf(c)%PALETTE.length];const v={evidence:c.scores.evidence,testability:c.scores.testability,lowBurden:100-c.scores.burden,importance:c.scores.importance,novelty:c.scores.novelty};
  g+=`<polygon points="${axes.map((a,i)=>pt(i,v[a[0]]).join(',')).join(' ')}" fill="${col}" fill-opacity=".12" stroke="${col}" stroke-width="2"/>`;
  axes.forEach((a,i)=>{const[x,y]=pt(i,v[a[0]]);g+=`<circle cx="${x}" cy="${y}" r="3" fill="${col}"/>`})});
 return`<svg class="radar" viewBox="0 0 360 300" style="width:100%;max-width:440px;height:auto" role="img" aria-label="仮説比較レーダーチャート">${g}</svg>`;
}

 <table><tr><th>区分</th><th>変数</th><th>単位</th><th>測定方法</th></tr>${p.plan.measures.map(m=>`<tr><td>${esc(m.role)}</td><td>${esc(m.n)}</td><td>${esc(m.u)}</td><td>${esc(m.m)}</td></tr>`).join('')}${p.plan.controls.map(m=>`<tr><td>統制変数</td><td>${esc(m.n)}</td><td>${esc(m.u)}</td><td>${esc(m.m)}</td></tr>`).join('')}</table>`:na}

 <h2>8. 複数AI討論の記録</h2>${p.debate.length?`<table><tr><th>ラウンド</th><th>発言者</th><th>内容</th></tr>${p.debate.map(m=>`<tr><td>${esc((ROUND_T[m.round]||'').split('　')[0])}</td><td>${esc(AGENTS[m.agent].name)}</td><td>${esc(m.text)}</td></tr>`).join('')}</table>`:na}
 <h2>9. 新仮説の比較</h2>${sorted.length?`<p>重み：根拠${p.weights.evidence}・検証可能性${p.weights.testability}・実験負担の低さ${p.weights.burden}・重要性${p.weights.importance}・新規性${p.weights.novelty}</p>
 <table><tr><th>仮説</th><th>内容</th><th>根拠</th><th>検証</th><th>負担</th><th>重要</th><th>新規</th><th>総合</th><th>判断</th></tr>${sorted.map(c=>`<tr><td>${esc(c.label)}<br><small>${esc(c.type)}</small></td><td>${esc(c.text)}</td><td>${esc(c.scores.evidence)}</td><td>${esc(c.scores.testability)}</td><td>${esc(c.scores.burden)}</td><td>${esc(c.scores.importance)}</td><td>${esc(c.scores.novelty)}</td><td><b>${esc(c.total)}</b></td><td>${esc(c.status)}</td></tr>`).join('')}</table>`:na}
 <h2>10. 研究者の判断記録と所見</h2>${p.decisions.length?`<ul>${p.decisions.slice(-30).map(d=>`<li><small>${esc(d.at)}</small>　${esc(d.text)}</li>`).join('')}</ul>`:'<p>判断記録はありません。</p>'}
 ${p.reportNote?`<h3>研究者所見</h3><p class="pre">${esc(p.reportNote)}</p>`:''}
 <h2>11. 次のステップ（提案）</h2><ol>${nexts.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>

const REPORT_CSS=`.report{background:#fff;color:#111827;max-width:900px;margin:0 auto;padding:40px 46px;border-radius:6px;font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Yu Gothic",serif;font-size:13.5px;line-height:1.8;box-shadow:0 4px 24px rgba(15,23,42,.12)}
.report h1{font-size:22px;margin:6px 0 12px;font-family:"Yu Gothic","Meiryo",sans-serif}.report h2{font-size:15.5px;margin:28px 0 8px;padding-bottom:4px;border-bottom:2px solid #0f766e;font-family:"Yu Gothic","Meiryo",sans-serif}
.report h3{font-size:13.5px;margin:14px 0 4px;font-family:"Yu Gothic","Meiryo",sans-serif}.report p{margin:4px 0}.report table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
.report th,.report td{border:1px solid #d6dde4;padding:5px 8px;text-align:left;vertical-align:top}.report th{background:#f1f5f7;font-weight:700;white-space:nowrap}
.report blockquote{margin:8px 0;padding:10px 14px;border-left:4px solid #0f766e;background:#f0faf8}.report .rp-kicker{font:700 11.5px Consolas,monospace;letter-spacing:.12em;color:#0f766e}
.report .rp-warn{font-size:12px;background:#fff7e6;border:1px solid #f3d7a0;padding:8px 12px;border-radius:4px}.report .na{color:#6b7280}.report small{color:#4b5563}
.report .rp-meta th{width:16%}.report .rp-name{font-size:11.5px;color:#4b5563;margin-top:2px}.report .rp-foot{margin-top:30px;font-size:11px;color:#6b7280;text-align:right}.report .pre{white-space:pre-wrap}
@media (max-width:700px){.report{padding:22px 16px}}@media print{.report{box-shadow:none;padding:0;max-width:none}}`;
function viewReport(){
 const head=pageHead('06','研究報告書','研究過程（仮説・根拠・批判・討論・比較・研究者の判断）を報告書として統合します。HTML・テキスト・JSONで保存、またはブラウザの印刷機能でPDF化できます。',
  `<button class="btn pri" data-act="dlHtml">HTMLで保存</button><button class="btn" data-act="dlTxt">テキストで保存</button><button class="btn" data-act="dlJson">JSONで保存</button><button class="btn" data-act="print">印刷 / PDF</button>`);
 const notDone=!P.reportAt;
 return head+staleBanner()+(notDone?`<div class="banner info no-print"><span>報告書ドラフト作成タスクは未完了です。現時点のデータで報告書を表示しています。</span><button class="btn sm pri" data-act="runUpTo" data-k="report">全工程を即時実行して完成させる</button></div>`:'')+
 `<section class="card no-print"><h2>研究者所見</h2><textarea data-bind="reportNote" rows="3" placeholder="報告書に記載する研究者の所見・判断理由を入力">${esc(P.reportNote)}</textarea><p class="hint">入力内容は報告書の「10. 研究者の判断記録と所見」に反映されます（表示は画面切替時に更新）。</p></section>
 <div class="report" id="reportBody">${buildReport(P)}</div>`;
}
function reportText(){
 const div=document.createElement('div');div.innerHTML=buildReport(P);
 div.querySelectorAll('tr').forEach(tr=>{tr.appendChild(document.createTextNode('\n'))});
 div.querySelectorAll('th,td').forEach(c=>{c.appendChild(document.createTextNode(' | '))});
 div.querySelectorAll('h1,h2,h3').forEach(h=>{h.insertBefore(document.createTextNode('\n\n'+(h.tagName==='H2'?'■ ':h.tagName==='H3'?'◇ ':'')),h.firstChild);h.appendChild(document.createTextNode('\n'))});
 div.querySelectorAll('p,li,blockquote,table').forEach(e=>{e.appendChild(document.createTextNode('\n'))});
 div.querySelectorAll('li').forEach(e=>{e.insertBefore(document.createTextNode('・'),e.firstChild)});
 return div.textContent.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
function fileSafe(s){return String(s||'research').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,40)}

// ---------- events ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const act=el.dataset.act,k=el.dataset.k,id=el.dataset.id;
 switch(act){
  case'go':go(el.dataset.v);break;
  case'newProject':{stopOrch();stopPlay();const p=newProject();DB.projects.push(p);P=p;DB.currentId=p.id;touch();go('register');toast('新しい研究を作成しました');break}
  case'addSample':{stopOrch();stopPlay();const s=SAMPLES.find(x=>x.key===k);const p=newProject(s);DB.projects.push(p);P=p;DB.currentId=p.id;touch();go('register');toast('架空の研究事例を追加しました');break}
  case'deleteProject':{if(!confirm(`「${P.title}」を削除します。元に戻せません。よろしいですか？`))return;stopOrch();stopPlay();DB.projects=DB.projects.filter(p=>p.id!==P.id);if(!DB.projects.length)DB.projects.push(newProject(SAMPLES[0]));P=DB.projects[0];DB.currentId=P.id;save();go('register');toast('研究を削除しました');break}
  case'exportAll':download(`rihrp_backup_${dateTag()}.json`,JSON.stringify(DB,null,1),'application/json');toast('全研究データをJSONで保存しました');break;
  case'exportOne':download(`rihrp_${fileSafe(P.title)}_${dateTag()}.json`,JSON.stringify({version:1,projects:[P]},null,1),'application/json');break;
  case'importAll':$('#fileJson').click();break;
  case'saveRev':if(!P.hypothesis.trim()){toast('研究仮説を入力してください');return}if(recordRevision('研究者による修正')){P.stale=P.tasks.some(t=>t.status!=='blocked'&&t.status!=='ready');toast('改訂 r'+P.revision+' を記録しました');render()}else toast('前回の改訂から変更はありません');break;
  case'restoreRev':{const r=P.revisions.find(x=>x.rev===+el.dataset.i);if(r&&confirm(`r${r.rev} の仮説と前提条件を復元します。よろしいですか？`)){P.hypothesis=r.hypothesis;P.conditions=r.conditions;P.stale=true;touch();render();toast('r'+r.rev+' を復元しました')}break}
  case'startFlow':startFlow();break;
  case'run':startOrch();break;
  case'pause':stopOrch('⏸ 研究者が一時停止');touch();render();break;
  case'step':stepOnce();break;
  case'resetRun':if(confirm('全タスクをリセットして最初から再実行します（取込資料・採択済み候補・判断記録は保持）。よろしいですか？')){resetAll();decide('研究フロー全体を再実行');startOrch()}break;
  case'approve':approve(k);break;
  case'reject':reject(k);break;
  case'rerun':rerun(k);break;
  case'runUpTo':runUpTo(k);break;
  case'playDebate':playDebate();renderDebateCtrls();break;
  case'pausePlay':stopPlay();renderChat();renderDebateCtrls();break;
  case'showAll':stopPlay();P.debateShown=P.debate.length;touch();renderChat();renderDebateCtrls();break;
  case'regenDebate':{if(!P.hypothesis.trim())return;stopPlay();const t=task(P,'debate');if(t.status==='done'||t.status==='approval'){EFFECTS.debate(P);log('↻ 討論を再生成');touch();render();setTimeout(playDebate,200)}else runUpTo('debate');break}
  case'chip':RT.draft=el.dataset.t;{const d=$('#draft');if(d){d.value=RT.draft;d.focus()}}break;
  case'send':sendInterject();break;
  case'importEv':if(!P.hypothesis.trim()){toast('研究仮説を入力してください');return}$('#fileEv').click();break;
  case'toggleAddEv':RT.showAddEv=!RT.showAddEv;render();break;
  case'addEv':{const t=$('#ae_title').value.trim();if(!t){toast('タイトルを入力してください');return}if(!P.hypothesis.trim()){toast('研究仮説を入力してください');return}
   addImported({title:t,type:$('#ae_type').value,year:$('#ae_year').value,n:$('#ae_n').value,stance:$('#ae_stance').value,summary:$('#ae_sum').value,source:'manual'});
   RT.showAddEv=false;decide('資料を手動追加：'+t);refreshCritiques(P);scoreAll(P);touch();render();toast('資料を追加しました');break}
  case'evAccept':{const ev=P.evidence.find(x=>x.id===id);if(ev){ev.accepted=ev.accepted===false;decide(`資料「${short(ev.title,30)}」を${ev.accepted?'根拠に含める':'根拠から除外'}`);refreshCritiques(P);scoreAll(P);touch();render()}break}
  case'evDel':{const ev=P.evidence.find(x=>x.id===id);if(ev&&confirm(`「${ev.title}」を削除しますか？`)){P.evidence=P.evidence.filter(x=>x.id!==id);refreshCritiques(P);scoreAll(P);touch();render()}break}
  case'crStatus':{const c=(P.critiques||[]).find(x=>x.id===id);if(c){c.status=el.dataset.s;decide(`指摘「${c.cat}」を${c.status}に変更`);touch();render()}break}
  case'regenCand':{if(!P.candidates){runUpTo('evaluate');return}P.genCount=(P.genCount||0)+1;genCandidates(P);RT.cmpSel=null;log('↻ 新仮説を再生成');decide('新仮説を再生成');touch();render();toast('新しい仮説を生成しました');break}
  case'candStatus':{const c=P.candidates.find(x=>x.id===id);if(c){c.status=c.status===el.dataset.s?'候補':el.dataset.s;decide(`${c.label}（${c.type}）を「${c.status}」に設定`);touch();render()}break}
  case'candEdit':RT.editing=id;render();{const t=$('#candEdit');if(t)t.focus()}break;
  case'candCancel':RT.editing=null;render();break;
  case'candSave':{const c=P.candidates.find(x=>x.id===id);const v=$('#candEdit').value.trim();if(!c||!v)return;
   if(c.origin==='主仮説'){RT.editing=null;P.hypothesis=v;decide('主仮説を修正：'+short(v,60));startFlow();return}
   c.text=v;c.edited=true;const f=findVars(v,A(P).field).map(x=>x.n);if(f.length>=2)c.vars=uniq(f);scoreCand(c,P);RT.editing=null;decide(`${c.label}を修正`);touch();render();toast(c.label+' を再評価しました');break}
  case'setMain':{const c=P.candidates.find(x=>x.id===id);if(!c||!confirm(`${c.label}を主仮説として採用し、研究フローを再実行します。よろしいですか？`))return;
   decide(`${c.label}（${c.type}）を主仮説に採択`);c.status='候補';P.hypothesis=c.text;P.candidates=P.candidates.filter(x=>x.id!==c.id);recordRevision(`${c.label}（${c.type}）を主仮説に採択`);resetAll(true);P.stale=false;go('tasks');startOrch();break}
  case'dlHtml':{const html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(P.title)} 研究報告書</title><style>body{margin:0;background:#eef2f5;padding:24px}${REPORT_CSS}</style></head><body><div class="report">${buildReport(P)}</div></body></html>`;
   download(`RIHRP報告書_${fileSafe(P.title)}_${dateTag()}.html`,html,'text/html;charset=utf-8');toast('報告書をHTMLで保存しました');break}
  case'dlTxt':download(`RIHRP報告書_${fileSafe(P.title)}_${dateTag()}.txt`,reportText());toast('報告書をテキストで保存しました');break;
  case'dlJson':download(`rihrp_${fileSafe(P.title)}_${dateTag()}.json`,JSON.stringify({version:1,projects:[P]},null,1),'application/json');break;
  case'print':window.print();break;
 }
});
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.bind&&t.type!=='checkbox'&&t.tagName!=='SELECT'){
  setPath(P,t.dataset.bind,t.value);
  if(['hypothesis','conditions','field'].includes(t.dataset.bind)&&P.analysis)P.stale=true;
  if(t.dataset.bind==='title')renderHeader();
  const lc=$('#liveCheck');if(lc&&['hypothesis','conditions'].includes(t.dataset.bind))lc.innerHTML=liveCheckHTML();
  touch();renderNav();
 }
 if(t.id==='draft')RT.draft=t.value;
 if(t.dataset.w){P.weights[t.dataset.w]=+t.value;const b=document.querySelector(`[data-wv="${t.dataset.w}"]`);if(b)b.textContent=t.value;scoreAll(P);touch();
  clearTimeout(RT.wT);RT.wT=setTimeout(()=>{const y=window.scrollY;render();window.scrollTo(0,y)},180)}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='projSel'){stopOrch();stopPlay();P=DB.projects.find(p=>p.id===t.value)||P;DB.currentId=P.id;RT.cmpSel=null;RT.draft='';touch();render();return}
 if(t.id==='speedSel'){DB.settings.speed=+t.value;touch();return}
 if(t.id==='fileJson'){if(t.files[0])importAll(t.files[0]);t.value='';return}
 if(t.id==='fileEv'){if(t.files.length)importEvidenceFiles(t.files);t.value='';return}
 if(t.dataset.bind&&(t.tagName==='SELECT'||t.type==='checkbox')){
  setPath(P,t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
  if(t.dataset.bind==='field'){if(P.analysis)P.stale=true;const lc=$('#liveCheck');if(lc)lc.innerHTML=liveCheckHTML()}
  if(t.dataset.bind.startsWith('constraints')){if(P.plan)P.plan=makePlan(P);if(P.ethics)P.ethics=ethicsCheck(P);if(P.critiques)refreshCritiques(P);scoreAll(P);decide(`研究条件を変更（${t.dataset.bind==='constraints.safety'?'安全性重視：'+(t.checked?'あり':'なし'):t.value}）`)}
  touch();renderNav();return;
 }
 if(t.dataset.evstance){const ev=P.evidence.find(x=>x.id===t.dataset.evstance);if(ev){ev.stance=t.value;ev.userStance=true;ev.note='研究者が立場を「'+STANCE[t.value]+'」に修正';decide(`資料「${short(ev.title,30)}」の立場を${STANCE[t.value]}に修正`);refreshCritiques(P);scoreAll(P);touch();render()}return}
 if(t.dataset.cmp){const id=t.dataset.cmp;RT.cmpSel=RT.cmpSel||[];if(t.checked){if(!RT.cmpSel.includes(id))RT.cmpSel.push(id)}else RT.cmpSel=RT.cmpSel.filter(x=>x!==id);const y=window.scrollY;render();window.scrollTo(0,y)}
});
document.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendInterject()}});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(DB))}catch(e){}});

// ---------- boot ----------
(function boot(){
 const st=document.createElement('style');st.textContent=REPORT_CSS;document.head.appendChild(st);
 load();render();save();
})();
</script>
