components:
  schemas:
    ClaimIn:
      properties:
        text:
          maxLength: 2000
          minLength: 10
          title: Text
          type: string
      required:
      - text
      title: ClaimIn
      type: object
    ClaimPatch:
      properties:
        text:
          maxLength: 2000
          minLength: 10
          title: Text
          type: string
      required:
      - text
      title: ClaimPatch
      type: object
    EvidenceIn:
      properties:
        note:
          default: ''
          maxLength: 1000
          title: Note
          type: string
        quote:
          default: ''
          maxLength: 500
          title: Quote
          type: string
        source_id:
          maxLength: 36
          minLength: 1
          title: Source Id
          type: string
      required:
      - source_id
      title: EvidenceIn
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    LoginIn:
      properties:
        email:
          maxLength: 255
          minLength: 3
          title: Email
          type: string
        password:
          maxLength: 200
          minLength: 1
          title: Password
          type: string
      required:
      - email
      - password
      title: LoginIn
      type: object
    ParagraphIn:
      properties:
        claimIds:
          items:
            type: string
          title: Claimids
          type: array
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        text:
          default: ''
          maxLength: 20000
          title: Text
          type: string
      title: ParagraphIn
      type: object
    ProjectIn:
      properties:
        summary:
          default: ''
          maxLength: 5000
          title: Summary
          type: string
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: ProjectIn
      type: object
    ProjectPatch:
      properties:
        status:
          anyOf:
          - enum:
            - active
            - archived
            type: string
          - type: 'null'
          title: Status
        summary:
          anyOf:
          - maxLength: 5000
            type: string
          - type: 'null'
          title: Summary
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: ProjectPatch
      type: object
    ReportContentIn:
      properties:
        sections:
          items:
            $ref: '#/components/schemas/SectionIn'
          title: Sections
          type: array
      title: ReportContentIn
      type: object
    ReportIn:
      properties:
        title:
          maxLength: 200
          minLength: 1
          title: Title
          type: string
      required:
      - title
      title: ReportIn
      type: object
    ReportUpdate:
      properties:
        content:
          anyOf:
          - $ref: '#/components/schemas/ReportContentIn'
          - type: 'null'
        note:
          default: ''
          maxLength: 300
          title: Note
          type: string
        title:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Title
      title: ReportUpdate
      type: object
    ReviewIn:
      properties:
        comment:
          default: ''
          maxLength: 5000
          title: Comment
          type: string
        decision:
          enum:
          - approved
          - changes_requested
          title: Decision
          type: string
      required:
      - decision
      title: ReviewIn
      type: object
    SectionIn:
      properties:
        heading:
          default: ''
          maxLength: 300
          title: Heading
          type: string
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        paragraphs:
          items:
            $ref: '#/components/schemas/ParagraphIn'
          title: Paragraphs
          type: array
      title: SectionIn
      type: object
    SourceIn:
      properties:
        content:
          minLength: 1
          title: Content
          type: string
        kind:
          default: text
          enum:
          - url
          - doi
          - text
          title: Kind
          type: string
        origin:
          default: ''
          maxLength: 1000
          title: Origin
          type: string
        title:
          maxLength: 300
          minLength: 1
          title: Title
          type: string
      required:
      - title
      - content
      title: SourceIn
      type: object
    UserIn:
      properties:
        email:
          maxLength: 255
          minLength: 3
          title: Email
          type: string
        name:
          maxLength: 120
          minLength: 1
          title: Name
          type: string
        password:
          maxLength: 200
          minLength: 12
          title: Password
          type: string
        role:
          enum:
          - admin
          - editor
          - reviewer
          - viewer
          title: Role
          type: string
      required:
      - email
      - name
      - role
      - password
      title: UserIn
      type: object
    UserPatch:
      properties:
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        name:
          anyOf:
          - maxLength: 120
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        role:
          anyOf:
          - enum:
            - admin
            - editor
            - reviewer
            - viewer
            type: string
          - type: 'null'
          title: Role
      title: UserPatch
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
